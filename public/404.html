<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141716" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | FitBodyStat</title>
    <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #141716;
        --surface: #1c211f;
        --surface-strong: #242b28;
        --text: #f4f5f3;
        --muted: #aeb8b3;
        --border: #37413d;
        --primary: #70b8c2;
        --primary-action: #245d67;
        --accent: #d6a14f;
        --shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: var(--text);
        background:
          linear-gradient(135deg, rgba(37, 99, 111, 0.13), transparent 34rem),
          radial-gradient(circle at 92% 12%, rgba(200, 132, 45, 0.12), transparent 22rem),
          var(--bg);
      }

      main {
        width: min(620px, 100%);
        padding: clamp(1.5rem, 5vw, 2.5rem);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        color: #fffaf0;
        background: var(--primary-action);
        border-radius: 6px;
        font-weight: 800;
      }

      .brand span:last-child { display: grid; }
      .brand strong { font-size: 1rem; }
      .brand small { color: var(--muted); }

      .error-code {
        margin: 2.5rem 0 0.35rem;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 6vw, 2.75rem);
        line-height: 1.08;
      }

      p {
        max-width: 48ch;
        margin: 1rem 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1rem;
        color: var(--text);
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-weight: 700;
        text-decoration: none;
      }

      .button.primary {
        color: #fff;
        background: var(--primary-action);
        border-color: var(--primary-action);
      }

      .button:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        body { padding: 1rem; }
        main { padding: 1.25rem; }
        .actions { display: grid; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Ir para o FitBodyStat">
        <span class="brand-mark" aria-hidden="true">FBS</span>
        <span>
          <strong>FitBodyStat</strong>
          <small>peso, medidas e composição</small>
        </span>
      </a>

      <p class="error-code">Erro 404</p>
      <h1>Esta página não foi encontrada.</h1>
      <p>O endereço pode estar incorreto ou o conteúdo pode ter sido movido. Seu acompanhamento continua disponível no aplicativo.</p>

      <div class="actions">
        <a class="button primary" href="/">Voltar ao FitBodyStat</a>
        <a class="button" href="/login.html">Ir para o login</a>
      </div>
    </main>
    </div>
  </body>
</html>
